description: >-
  Spark's client-side display surface, recorded with the vendor's own framing. FBS is explicit
  that the APIs themselves ship no display component — the FAQ answers "Do the APIs have a
  display component I can add to my website?" with "No. Our APIs are raw data feeds meant to be
  used by web developers." The prebuilt listing-display products (IDX WordPress plugin,
  SmartFrame) are separately sold FBS products, not API-level UI libraries, and are bought
  through fbsproducts.com rather than provisioned from a developer key. They are catalogued
  here because they are the real embeddable surface an integrator is pointed at, but they are
  not equivalent to a vendor element/component library.

