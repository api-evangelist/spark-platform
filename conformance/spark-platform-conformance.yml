certification:
  body: RESO (Real Estate Standards Organization)
  organization: FBS
  organization_uoi: T00000052
  status: Certified Current
  summary_url: https://certification.reso.org/summary/T00000052
  summary_url_note: Returns HTTP 400 to a plain GET — RESO Analytics is a browser application, not a machine-readable endpoint.
  machine_readable_feed: https://services.reso.org/orgs?showStats=true&showEndorsements=true
  organizations_covered_as_provider: 140
  mandate_note: >-
    RESO certification is required of MLSs by the National Association of REALTORS — an industry
    body, not a government regulator. Spark's exposure is the vendor side of that private
    mandate.

