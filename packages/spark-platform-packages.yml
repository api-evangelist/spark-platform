    registry: rubygems
    name: spark_api
    url: https://rubygems.org/gems/spark_api
    source: https://github.com/sparkapi/spark_api
    install: gem install spark_api
    official: true
    version: 2.0.3
    downloads: 232098
    last_repo_push: '2026-05-08'
    note: The flagship client — "Ruby client library for communication with the Spark API".
  - language: ruby
    registry: rubygems
    name: sparkql
    url: https://rubygems.org/gems/sparkql
    source: https://github.com/sparkapi/sparkql
    install: gem install sparkql
    official: true
    version: 1.3.6
    downloads: 112550
    last_repo_push: '2026-06-25'
    note: >-
      Racc-based parser for the SparkQL _filter syntax. Not an API client — the grammar
      implementation, useful for validating filters before they are sent.
  - language: php
