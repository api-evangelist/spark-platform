generated: '2026-07-26'
method: searched
source: >-
  https://sparkplatform.com/docs/supporting_documentation/api_clients (the vendor's own
  "Spark(R) API Clients" page, HTTP 200) cross-checked against the sparkapi GitHub
  organization (https://github.com/sparkapi, HTTP 200), RubyGems, and Packagist. Registry
  metadata (version, download count) read from the registry APIs on 2026-07-26.
description: >-
  First-party Spark Platform client libraries published by FBS. Five languages are listed on
  the vendor's own API Clients page — Ruby, PHP, Java, Objective-C (iOS) and Android — plus a
  standalone parser for the SparkQL filter grammar and a RESO-compliant feed faker used for
  local testing. Only Ruby and PHP libraries are actually distributed through a package
  registry; the Java, iOS and Android clients are source-only GitHub repositories with no
  Maven Central / CocoaPods coordinates found. Several repositories have not been updated in
  years and freshness is recorded per package rather than smoothed over.
docs: https://sparkplatform.com/docs/supporting_documentation/api_clients

packages:
