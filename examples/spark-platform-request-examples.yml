description: >-
  Real, first-party request examples for both Spark surfaces, flattened out of FBS's published
  Postman collection. Spark publishes no OpenAPI, so this collection is the only structured
  inventory of callable paths the vendor puts in the open — 64 requests across the Spark API
  (/v1) and the RESO Web API (/Reso/OData). Placeholders such as <Insert_ListingKey> and
  <Insert_MlsId> are the vendor's own; no values are invented here, and every request requires
  a licensed Bearer token (all return HTTP 401 anonymously). Note that the collection routes
  Spark API traffic at replication.sparkapi.com rather than sparkapi.com — the read/replication
  host — which matches error code 1021 in errors/spark-platform-error-codes.yml.
