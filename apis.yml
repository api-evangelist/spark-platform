name: Spark Platform
kind: company
description: >-
  Spark Platform is the MLS data platform built by FBS, a 100% employee-owned company in Fargo,
  North Dakota that has served the US Multiple Listing Service industry for over 30 years and
  operates the Flexmls MLS system for more than 120 MLS organizations. Spark sits in the
  distribution layer of US residential real estate: it takes MLS content out of Flexmls and
  exposes it to third-party developers through two documented interfaces — the proprietary
  Spark API (https://sparkapi.com/v1, SparkQL filtering, listings, contacts, saved searches,
  market statistics, portals/VOW accounts) and a RESO Web API implementation at the
  /Reso/OData endpoint (https://replication.sparkapi.com/Version/3/Reso/OData/) serving
  Property, Member, Office, Media, OpenHouse, Room, Unit, GreenVerification, PowerProduction
  and Lookup resources against the RESO Data Dictionary. FBS is a RESO Certified technology
  provider (Unique Organization Identifier T00000052, status "Certified Current") and appears
  as the certifying provider on RESO Web API Core 2.0.0 and Data Dictionary 1.7 / 2.0
  endorsements for 138 MLS organizations plus one commercial board in the public RESO
  organizations feed; FBS itself additionally holds RESO webhooks 1.0.0 and RESO Common
  Format 2.0 endorsements. The API posture must be stated honestly: the documentation is
  genuinely public and unusually complete, developer registration is a free public form, and
  the endpoints are live — but they are not open. Every probed data endpoint, including the
  OData $metadata document, returns HTTP 401 "Invalid API key and/or request signed
  improperly" anonymously. Real data requires a Developer Agreement with FBS, an MLS-approved
  data plan purchased through the Spark Datamart under an IDX, VOW or Private role, and a
  per-MLS fee. Certification here is real and verifiable; reachability is licensed. Home
  market is the United States.
