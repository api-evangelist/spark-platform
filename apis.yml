- aid: spark-platform:spark-webhooks
  name: Spark Webhooks
  description: >-
    Outbound webhook delivery from the Spark platform. When a Property, Member or Office
    record changes in an upstream MLS, Spark POSTs a RESO Web API Entity Event payload over
    HTTPS to a subscriber URL, signed with an HMAC-SHA256 signature in a Signature header,
    with up to 3 retries, exponential backoff and a roughly 2-second response timeout.
    Subscriptions are filtered by MLS and resource type and support catch-up replay. FBS
    holds a RESO webhooks 1.0.0 certification endorsement for this surface. Subscriptions
    are arranged with FBS rather than self-provisioned.
  humanURL: https://sparkplatform.com/docs/webhooks/webhooks
  baseURL: https://replication.sparkapi.com/v1
