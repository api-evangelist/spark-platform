apis:
- aid: spark-platform:spark-api
  name: Spark API
  description: >-
    FBS's proprietary REST API over Flexmls MLS content. Documented services include Listings
    (plus photos, documents, floor plans, videos, virtual tours, open houses, rooms, units,
    history and rules), Contacts, Saved Searches, Listing Carts, Portals/VOW accounts, Market
    Statistics, Overlays, Standard Fields and custom field metadata, System Info, and a
    Developers service for keys, roles, domains, authorizations and usage. Filtering uses
    SparkQL. Authentication is a Bearer access token obtained through OAuth 2 or an
    MLS-issued non-expiring token; anonymous requests return HTTP 401.
  humanURL: https://sparkplatform.com/docs/overview/api
  baseURL: https://sparkapi.com/v1
