cross_surface_note: >-
  The two surfaces are projections of the same Flexmls core, not a superset and a subset. The
  Spark API exposes Flexmls-native concepts the RESO model has no home for (contacts, saved
  searches, listing carts, portals, market statistics, overlays, developer administration);
  the RESO Web API exposes the standardized Data Dictionary shape that a multi-vendor consumer
  can reuse across MLS vendors. Media is the clearest divergence: Spark splits it into photos,
  videos, virtual tours, documents and floor plans; RESO folds all of it into one Media
  resource keyed by ResourceRecordKey.

identity_keys:
  - {name: ListingKey, note: Primary listing identifier used in both surfaces.}
  - {name: MlsId, note: Identifies the source MLS; the unit of licensing, pricing and data-plan approval.}
  - {name: MemberMlsId / MemberNrdsId, note: Member identity, also carried as OIDC claims.}
  - {name: OfficeKey / OfficeMlsId, note: Office identity, also carried as OIDC claims.}
  - {name: MediaKey, note: Media record identifier on the RESO surface.}
  - {name: UPI, note: "RESO Universal Property Identifier — no reference found in the documentation."}
